name: Screenshots

# Renders every screen to PNG (Robolectric) and publishes them to the `screenshots` branch,
# one folder per source branch, so the design can be reviewed without a phone.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ui/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "app.allinonereminder.screenshots.*" -Pscreenshots=true --stacktrace

      - name: Publish to the screenshots branch
        run: |
          set -e
          SRC="$(pwd)/app/build/screenshots"
          ls "$SRC"
          DEST="${GITHUB_REF_NAME//\//-}"
          TMP="$(mktemp -d)"
          cp -r "$SRC"/. "$TMP"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin screenshots; then
            git checkout -B screenshots origin/screenshots
          else
            git checkout --orphan screenshots
            git rm -rf --quiet .
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$TMP"/. "$DEST"/
          echo "${GITHUB_SHA}" > "$DEST/COMMIT"
          git add "$DEST"
          git commit -m "Screenshots for $GITHUB_REF_NAME at ${GITHUB_SHA::7}" || echo "No changes"
          git push origin screenshots
