name: core-sync

on:
  pull_request:
    paths:
      - "core/sync/**"
      - ".github/workflows/core-sync.yml"
  push:
    branches: [main]
    paths:
      - "core/sync/**"
      - ".github/workflows/core-sync.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and enforce 90% line coverage
        run: ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-sync-coverage
          path: core/sync/build/reports/jacoco/test/html
